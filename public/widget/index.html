<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Mascotas perdidas de la zona</title>
  <style>
    /* Widget embebible (Tanda 20). Tema claro fijo: se muestra dentro de sitios
       ajenos. Sin dependencias externas: todo inline. */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1f2937; background: #ffffff; font-size: 14px; line-height: 1.4;
    }
    .wrap { padding: 12px; }
    h1 { font-size: 15px; margin: 0 0 10px; color: #b91c1c; }
    .estado { color: #6b7280; padding: 24px 8px; text-align: center; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    a.card {
      display: flex; gap: 10px; align-items: center; text-decoration: none; color: inherit;
      border: 1px solid #e5e7eb; border-radius: 12px; padding: 8px; transition: background .15s;
    }
    a.card:hover { background: #f9fafb; }
    .thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: #f3f4f6; flex: 0 0 auto; }
    .info { min-width: 0; flex: 1; }
    .nombre { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta { color: #6b7280; font-size: 12px; }
    .badge { display: inline-block; font-size: 10px; font-weight: 700; color: #fff; border-radius: 999px; padding: 1px 7px; margin-right: 4px; }
    .b-perdida { background: #dc2626; }
    .b-encontrada { background: #16a34a; }
    .b-robada { background: #7c2d12; }
    footer { margin-top: 12px; text-align: center; font-size: 11px; }
    footer a { color: #b91c1c; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="titulo">Mascotas perdidas de la zona</h1>
    <div id="contenido" class="estado">Cargando…</div>
    <footer>Datos de <a id="masLink" href="/" target="_blank" rel="noopener">Encuentra tu Mascota</a></footer>
  </div>

  <script>
    // Las mismas credenciales PÚBLICAS que ya usa _worker.js y el bundle de la
    // app (la publishable key es pública por diseño; la RLS protege los datos).
    var SUPABASE_URL = 'https://ywlrcfaybnikaurxsgtj.supabase.co';
    var ANON = 'sb_publishable_K1UXXganPME34mfGqvt9vA_DOrcbwr6';

    function escapar(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    function haceCuanto(iso) {
      var d = (Date.now() - new Date(iso).getTime()) / 1000;
      if (d < 3600) return 'hace ' + Math.max(1, Math.round(d / 60)) + ' min';
      if (d < 86400) return 'hace ' + Math.round(d / 3600) + ' h';
      return 'hace ' + Math.round(d / 86400) + ' días';
    }

    var params = new URLSearchParams(location.search);
    var comuna = (params.get('comuna') || '').trim();
    var limite = Math.min(parseInt(params.get('limite') || '12', 10) || 12, 30);
    var cont = document.getElementById('contenido');
    var origin = location.origin;
    document.getElementById('masLink').href = origin + '/';

    if (comuna) {
      document.getElementById('titulo').textContent = 'Mascotas perdidas en ' + comuna;
    }

    function pintar(reportes) {
      if (!reportes.length) {
        cont.className = 'estado';
        cont.textContent = comuna
          ? 'No hay reportes activos en ' + comuna + ' por ahora.'
          : 'Agregá ?comuna=TuComuna a la URL del widget.';
        return;
      }
      var ul = document.createElement('ul');
      reportes.forEach(function (r) {
        var a = document.createElement('a');
        a.className = 'card';
        a.href = origin + '/mascota/' + encodeURIComponent(r.id);
        a.target = '_blank'; a.rel = 'noopener';
        var foto = (r.fotos && r.fotos[0]) ? r.fotos[0] : '';
        var esRobada = r.estado === 'perdida' && r.robada;
        var badge = esRobada
          ? '<span class="badge b-robada">ROBADA</span>'
          : (r.estado === 'perdida'
              ? '<span class="badge b-perdida">PERDIDA</span>'
              : '<span class="badge b-encontrada">ENCONTRADA</span>');
        a.innerHTML =
          (foto ? '<img class="thumb" src="' + escapar(foto) + '" alt="" loading="lazy">' : '<div class="thumb"></div>') +
          '<div class="info">' +
            '<div class="nombre">' + escapar(r.nombre || r.especie) + '</div>' +
            '<div class="meta">' + badge + escapar(r.especie) + ' · ' + haceCuanto(r.creado_en) + '</div>' +
          '</div>';
        ul.appendChild(a);
      });
      cont.replaceWith(ul);
    }

    // La RLS pública solo devuelve reportes activos no ocultos; igual lo fijamos
    // explícito. Comuna exacta (v1). `robada` viene de la 0068.
    var url = SUPABASE_URL + '/rest/v1/pets'
      + '?select=id,nombre,especie,estado,fotos,creado_en,robada'
      + '&activo=eq.true&oculto=eq.false'
      + (comuna ? '&comuna=eq.' + encodeURIComponent(comuna) : '')
      + '&order=creado_en.desc&limit=' + limite;

    fetch(url, { headers: { apikey: ANON, Authorization: 'Bearer ' + ANON } })
      .then(function (res) { if (!res.ok) throw new Error(res.status); return res.json(); })
      .then(pintar)
      .catch(function () {
        cont.className = 'estado';
        cont.textContent = 'No pudimos cargar los reportes ahora.';
      });
  </script>
</body>
</html>
