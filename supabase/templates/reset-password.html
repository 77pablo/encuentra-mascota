<!--
  Plantilla OPCIONAL de "Restablecer contraseña" (Reset password).
  Cómo usarla: dashboard de Supabase > Authentication > Emails > "Reset password"
  > pega este HTML. Variables disponibles (las provee Supabase, NO las cambies):
    {{ .ConfirmationURL }}  enlace que abre la pantalla de nueva contraseña
    {{ .Email }}           correo del usuario
  El enlace dispara el evento PASSWORD_RECOVERY que ya maneja src/hooks/useAuth.tsx
  para mostrar ResetPasswordScreen.
-->
<div style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 480px; margin: 0 auto; color: #1f2d27;">
  <h2 style="color: #1f6b4a;">Restablece tu contraseña</h2>
  <p>Recibimos una solicitud para cambiar la contraseña de tu cuenta. Pulsa el botón para elegir una nueva.</p>
  <p style="text-align: center; margin: 28px 0;">
    <a href="{{ .ConfirmationURL }}"
       style="background: #1f6b4a; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 10px; display: inline-block;">
      Cambiar mi contraseña
    </a>
  </p>
  <p style="font-size: 13px; color: #6b7a72;">Si no pediste esto, ignora este correo: tu contraseña seguirá igual.</p>
</div>
