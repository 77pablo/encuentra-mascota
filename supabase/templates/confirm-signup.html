<!--
  Plantilla OPCIONAL de "Confirmar registro" (Confirm signup).
  Cómo usarla: dashboard de Supabase > Authentication > Emails > "Confirm signup"
  > pega este HTML. Variables disponibles (las provee Supabase, NO las cambies):
    {{ .ConfirmationURL }}  enlace que confirma el correo
    {{ .Email }}           correo del usuario
  Si no pegas nada, Supabase usa su plantilla por defecto (también funciona).
-->
<div style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 480px; margin: 0 auto; color: #1f2d27;">
  <h2 style="color: #1f6b4a;">Bienvenido a Encuentra tu Mascota</h2>
  <p>Gracias por unirte al barrio. Confirma tu correo para empezar a publicar y encontrar mascotas cerca de ti.</p>
  <p style="text-align: center; margin: 28px 0;">
    <a href="{{ .ConfirmationURL }}"
       style="background: #1f6b4a; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 10px; display: inline-block;">
      Confirmar mi correo
    </a>
  </p>
  <p style="font-size: 13px; color: #6b7a72;">Si no creaste esta cuenta, puedes ignorar este mensaje.</p>
</div>
